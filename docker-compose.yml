services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hadrian3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hadrian3}
      POSTGRES_DB: ${POSTGRES_DB:-hadrian3}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hadrian3} -d ${POSTGRES_DB:-hadrian3}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hadrian3:hadrian3@db:5432/hadrian3}
      # Defaults to the synthetic sample workbook so a fresh clone runs as-is.
      XLSX_PATH: ${XLSX_PATH:-/data/samples/backtesting_repository_sample.xlsx}
      IS_OOS_SPLIT_DATE: ${IS_OOS_SPLIT_DATE:-2024-01-01}
      # Result directories of the upstream research engines. Unset by default;
      # see docker-compose.override.example.yml to wire your own in.
      HADRIAN2_RESULTS_DIR: ${HADRIAN2_RESULTS_DIR:-}
      HADRIAN_ENGINE_RESULTS_DIR: ${HADRIAN_ENGINE_RESULTS_DIR:-}
    volumes:
      - ./samples:/data/samples:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is baked into the bundle at build time. Empty means the
        # browser uses the page's own hostname at runtime (see lib/api.ts), so
        # the same image works on localhost and on any LAN IP without a rebuild.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
